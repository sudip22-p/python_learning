<!DOCTYPE html>
<html lang="ne">

<head>
    <meta charset="UTF-8">
    <title>KBC - परिणाम</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="main-flex" style="justify-content: center; align-items: center; min-height: 80vh;">
        <div class="left-side" style="max-width: 500px; margin: auto; text-align: center;">
            <div class="kbc-header">
                <img src="/static/logo.png" alt="KBC Logo" class="kbc-logo" onerror="this.style.display='none'">
                <div class="kbc-title">Ko Bancha Crorepati</div>
                <div class="kbc-subtitle">Game Over</div>
            </div>
            <div class="question-wrapper" style="margin-bottom: 32px;">
                <h1 style="color: #f1c40f; font-size: 2.2rem;">Congratulations!</h1>
                <div style="font-size: 1.5rem; color: #fff; margin: 18px 0;">You have won</div>
                <div style="font-size: 2.5rem; color: #f9a825; font-weight: bold; margin-bottom: 10px;">{{ prize }}
                </div>
                <p style="color: #fff;">Thank you for playing Ko Bancha Crorepati!</p>
            </div>
            <a href="/" class="take-money-btn" style="display: inline-block; margin-top: 16px;">फेरी सुरु गर्नुहोस्</a>
        </div>
    </div>
</body>

</html>
